<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Tracker</title>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="attendanceTable"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCJifjJLKktwE3eaijV0HB4Ytr0RXpqQc",
      authDomain: "attendance-tracker-daf54.firebaseapp.com",
      databaseURL: "https://attendance-tracker-daf54-default-rtdb.firebaseio.com",
      projectId: "attendance-tracker-daf54",
      storageBucket: "attendance-tracker-daf54.firebasestorage.app",
      messagingSenderId: "274752390593",
      appId: "1:274752390593:web:d7abb607cbf26e51811b40",
      measurementId: "G-JBXDNLHKK4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("attendance_records").on("value", (snapshot) => {
      const data = snapshot.val();
      const table = document.getElementById("attendanceTable");
      table.innerHTML = "";

      if (!data) {
        table.innerHTML = "No attendance records found.";
        return;
      }

      Object.values(data).forEach((item) => {
        const row = document.createElement("div");
        row.textContent = `${item.name} - ${item.status} - ${item.site}`;
        table.appendChild(row);
      });
    });
  </script>
</body>
</html>
