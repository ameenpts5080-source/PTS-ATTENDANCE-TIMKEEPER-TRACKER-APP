<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenician Site Attendance Tracker</title>
  
  <!-- Custom App Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231B2A2E'/><text x='50%' y='65%' font-size='50' font-weight='bold' text-anchor='middle' fill='%23FFFFFF'>PTS</text></svg>">

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #0284c7;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    h1 { margin-top: 0; color: #38bdf8; }
    .form-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }
    input, select, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
    }
    button {
      background: var(--accent);
      cursor: pointer;
      font-weight: bold;
      border: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-anchor: start;
    }
    th { background: #0f172a; }
    .status-present { color: #4ade80; font-weight: bold; }
    .status-absent { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Phoenician Technical Services LLC</h1>
    <h3>Site Attendance Tracker (Real-time Cloud Sync)</h3>

    <!-- Add Record Form -->
    <div class="form-group">
      <input type="text" id="siteName" placeholder="Site Name (e.g. Morocco Openspace)">
      <input type="text" id="empName" placeholder="Employee Name / ID">
      <select id="empStatus">
        <option value="PRESENT">PRESENT</option>
        <option value="ABSENT">ABSENT</option>
      </select>
      <button onclick="addAttendance()">Sync Record</button>
    </div>

    <!-- Live Sync Attendance Table -->
    <table>
      <thead>
        <tr>
          <th>Site</th>
          <th>Employee / AUX</th>
          <th>Status</th>
          <th>Time Synced</th>
        </tr>
      </thead>
      <tbody id="attendanceTable">
        <tr><td colspan="4" style="text-align:center;">Loading cloud records...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // 1. Your exact Firebase Configuration Keys
    const firebaseConfig = {
      apiKey: "AIzaSyCJifjJLKktwE3eaijV0HB4Ytr0RXpqQc",
      authDomain: "attendance-tracker-daf54.firebaseapp.com",
      databaseURL: "https://attendance-tracker-daf54-default-rtdb.firebaseio.com",
      projectId: "attendance-tracker-daf54",
      storageBucket: "attendance-tracker-daf54.firebasestorage.app",
      messagingSenderId: "274752390593",
      appId: "1:274752390593:web:d7abb607cbf26e51811b40",
      measurementId: "G-JBXDNLHKK4"
    };

    // 2. Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 3. Save Record Function (Pushes directly to Firebase Cloud)
    function addAttendance() {
      const site = document.getElementById("siteName").value.trim();
      const name = document.getElementById("empName").value.trim();
      const status = document.getElementById("empStatus").value;

      if (!site || !name) {
        alert("Please fill in Site Name and Employee Name!");
        return;
      }

      const record = {
        site: site,
        name: name,
        status: status,
        timestamp: new Date().toLocaleTimeString()
      };

      // Push record to Firebase 'attendance_records' node
      db.ref("attendance_records").push(record)
        .then(() => {
          document.getElementById("empName").value = "";
        })
        .catch((error) => {
          alert("Firebase Error: " + error.message);
        });
    }

    // 4. Real-time Cloud Listener (Updates table automatically on ALL devices)
    db.ref("attendance_records").on("value", (snapshot) => {
      const data = snapshot.val();
      const tableBody = document.getElementById("attendanceTable");
      tableBody.innerHTML = "";

      if (!data) {
        tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No attendance records found in Firebase database.</td></tr>';
        return;
      }

      Object.keys(data).forEach((key) => {
        const item = data[key];
        const row = document.createElement("tr");

        const statusClass = item.status === "PRESENT" ? "status-present" : "status-absent";

        row.innerHTML = `
          <td>${item.site}</td>
          <td>${item.name}</td>
          <td class="${statusClass}">${item.status}</td>
          <td>${item.timestamp || 'N/A'}</td>
        `;
        tableBody.prepend(row); // Show newest records at top
      });
    });
  </script>

</body>
</html>
